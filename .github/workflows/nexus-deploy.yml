name: Deploy Nexus AI to Virtual Machine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VM_APP_PATH }}
            git remote set-url origin https://github.com/verbosec/nexuschat.git
            git fetch origin
            git checkout nexus-brand || git checkout -b nexus-brand origin/nexus-brand
            git pull --ff-only origin nexus-brand
            docker compose up -d --build
